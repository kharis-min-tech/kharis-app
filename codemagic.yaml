workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get dependencies
        script: |
          cd app
          flutter pub get
      - name: Build APK
        script: |
          cd app
          flutter build apk --debug
      - name: List artifacts
        script: |
          find app/build -name "*.apk" -type f 2>/dev/null
    artifacts:
      - app/build/**/outputs/**/*.apk
      - app/build/**/outputs/**/*.aab
