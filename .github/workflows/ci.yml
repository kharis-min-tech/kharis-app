name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter-ci:
    name: Flutter Analyze, Test & Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Flutter as local development: the single pin is app/.fvmrc.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      # --enforce-lockfile: resolve exactly the committed app/pubspec.lock and
      # fail if pubspec.yaml changed without the lockfile being updated.
      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Flutter test
        working-directory: app
        run: flutter test

      # Local builds pass --dart-define-from-file=env.json; CI must compile the
      # same way. ENV_JSON is a verbatim copy of app/env.json. Pull requests
      # from forks cannot read secrets, so they build with the placeholder
      # values from env.example.json (compiles identically, keys just do not
      # authenticate).
      - name: Restore env.json
        working-directory: app
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          if [ -n "$ENV_JSON" ]; then
            printf '%s' "$ENV_JSON" > env.json
          else
            echo "::notice::ENV_JSON secret unavailable; building with env.example.json placeholders"
            cp env.example.json env.json
          fi

      # Identical to the documented local command (BUILD.md, "Web").
      - name: Flutter build web
        working-directory: app
        run: ./scripts/build-web.sh --build-only

      - name: Scrub env.json
        if: always()
        run: rm -f app/env.json

  storybook-test:
    name: Storybook Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the pnpm pinned by storybook/package.json (packageManager). With
      # `version: latest` the store path setup-node caches was computed by a
      # different pnpm than the one that ran the install, so the cache save
      # failed and turned every CI run red.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: storybook/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: storybook/pnpm-lock.yaml

      - name: Install Storybook dependencies
        working-directory: storybook
        run: pnpm install

      - name: Install Playwright browser
        working-directory: storybook
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook tests
        working-directory: storybook
        run: pnpm test
