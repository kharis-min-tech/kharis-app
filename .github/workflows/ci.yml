name: CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter-ci:
    name: Flutter Analyze, Test & Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Flutter test
        working-directory: app
        run: flutter test

      - name: Flutter build web
        working-directory: app
        run: flutter build web --release

  storybook-test:
    name: Storybook Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
          cache-dependency-path: storybook/pnpm-lock.yaml

      - name: Install Storybook dependencies
        working-directory: storybook
        run: pnpm install

      - name: Run Storybook tests
        working-directory: storybook
        run: pnpm test
