name: Build Android APK

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 5'

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          missing=""

          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEY_PROPERTIES" ] || missing="$missing KEY_PROPERTIES"
          [ -n "$ENV_JSON" ] || missing="$missing ENV_JSON"

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Restore env.json
        working-directory: app
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" > env.json

      - name: Decode keystore
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/upload-keystore.jks

          test -s keystore/upload-keystore.jks || {
            echo "::error::Decoded keystore is empty"
            exit 1
          }

      - name: Create key.properties
        working-directory: app/android
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          printf '%s' "$KEY_PROPERTIES" > key.properties

      - name: Verify signing key
        working-directory: app/android/app
        run: |
          EXPECTED="D6:C8:A9:80:23:3B:13:42:FB:F3:C6:90:71:0F:53:15:A0:0F:C1:3C:9F:13:C8:4F:75:23:54:BF:30:BA:87:A3"

          PW="$(grep -m1 '^storePassword=' key.properties | cut -d= -f2-)"

          ACTUAL="$(keytool -list -v \
            -keystore keystore/upload-keystore.jks \
            -storepass "$PW" 2>/dev/null \
            | grep -m1 'SHA256:' \
            | sed 's/.*SHA256: //' \
            | tr -d ' \r')"

          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the keystore"
            exit 1
          fi

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Keystore fingerprint mismatch"
            exit 1
          fi

          echo "Signing key verified"

      - name: Calculate build number
        id: build
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 4 ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Using build number: $BUILD_NUMBER"

      - name: Build Release APK
        working-directory: app
        run: |
          flutter build apk \
            --release \
            --build-number=${{ steps.build.outputs.build_number }} \
            --dart-define-from-file=env.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ steps.build.outputs.build_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Scrub credentials
        if: always()
        run: |
          rm -f app/env.json
          rm -f app/android/key.properties
          rm -f app/android/keystore/upload-keystore.jks