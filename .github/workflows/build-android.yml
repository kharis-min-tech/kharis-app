name: Build Android APK

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 5'

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          missing=""

          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEY_PROPERTIES" ] || missing="$missing KEY_PROPERTIES"
          [ -n "$ENV_JSON" ] || missing="$missing ENV_JSON"

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Restore env.json
        working-directory: app
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" > env.json

      - name: Decode keystore
        working-directory: app/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > kharis-release.jks

          test -s kharis-release.jks || {
            echo "::error::Decoded keystore is empty"
            exit 1
          }

      - name: Create key.properties
        working-directory: app/android
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          printf '%s' "$KEY_PROPERTIES" > key.properties

      - name: Calculate build number
        id: build
        run: |
          BUILD_NUMBER=$(date +%s)
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Using build number: $BUILD_NUMBER"
      - name: Verify signing files
        run: |
          echo "=== key.properties ==="
          cat app/android/key.properties
          echo ""
          echo "=== android/app ==="
          ls -la app/android/app
          echo ""
          echo "=== check keystore ==="
          test -f app/android/app/kharis-release.jks && echo "FOUND" || echo "MISSING"
      - name: Build Release APK
        working-directory: app
        run: |
          flutter build apk \
            --release \
            --build-number=${{ steps.build.outputs.build_number }} \
            --dart-define-from-file=env.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ steps.build.outputs.build_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload APK to Firebase App Distribution
        run: |
          firebase appdistribution:distribute \
            app/build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --groups "android-testers"

      - name: Scrub credentials
        if: always()
        run: |
          rm -f app/env.json
          rm -f app/android/key.properties
          rm -f app/android/app/kharis-release.jks