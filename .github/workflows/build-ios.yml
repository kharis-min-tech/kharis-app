
name: Build and Upload iOS to TestFlight

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 5'

jobs:
  build-ios:
    name: Build iOS Release IPA
    runs-on: macos-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Check required GitHub Secrets
      - name: Check required secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          missing=""

          [ -n "$IOS_CERTIFICATE_BASE64" ] || missing="$missing IOS_CERTIFICATE_BASE64"
          [ -n "$IOS_CERTIFICATE_PASSWORD" ] || missing="$missing IOS_CERTIFICATE_PASSWORD"
          [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "$ENV_JSON" ] || missing="$missing ENV_JSON"
          [ -n "$APPLE_ID" ] || missing="$missing APPLE_ID"
          [ -n "$APPLE_APP_PASSWORD" ] || missing="$missing APPLE_APP_PASSWORD"

          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      # 3. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      # 4. Install dependencies
      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      # 5. Restore environment configuration
      - name: Restore env.json
        working-directory: app
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$ENV_JSON" > env.json

      # 6. Install Apple Distribution certificate
      - name: Install Apple Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$IOS_CERTIFICATE_BASE64" \
            | base64 --decode > certificate.p12

          security create-keychain -p build build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k build \
            build.keychain

          echo "===== AVAILABLE SIGNING IDENTITIES ====="
          security find-identity -v -p codesigning build.keychain

          if ! security find-identity -v -p codesigning build.keychain \
            | grep -qE '^[[:space:]]*[0-9]+\)'; then
            echo "::error::No valid code-signing identity was found in build.keychain."
            exit 1
          fi

      # 7. Install the exact provisioning profile
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode > profile.mobileprovision

          security cms -D \
            -i profile.mobileprovision \
            -o profile.plist

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" profile.plist)

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" profile.plist)

          cp profile.mobileprovision \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Installed profile: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

          if [ "$PROFILE_UUID" != "979a3d26-6f9e-457d-8f5e-651006b23894" ]; then
            echo "::error::The installed provisioning profile UUID is not the expected profile."
            exit 1
          fi

      # 8. Inspect and validate provisioning profile
      - name: Inspect and verify provisioning profile
        run: |
          set -euo pipefail

          echo "===== PROFILE DETAILS ====="
          /usr/libexec/PlistBuddy -c "Print :Name" profile.plist
          /usr/libexec/PlistBuddy -c "Print :UUID" profile.plist
          /usr/libexec/PlistBuddy -c "Print :ExpirationDate" profile.plist

          echo "===== PROFILE ENTITLEMENTS ====="

          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" profile.plist)

          APS_ENV=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:aps-environment" profile.plist)

          ASSOCIATED_DOMAINS=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:com.apple.developer.associated-domains" \
            profile.plist)

          echo "Application identifier: $PROFILE_APP_ID"
          echo "Push notification environment: $APS_ENV"
          echo "Associated Domains entitlement: $ASSOCIATED_DOMAINS"

          case "$PROFILE_APP_ID" in
            Z9TTRH45X3.com.kharis.church) ;;
            *)
              echo "::error::Unexpected provisioning profile App ID: $PROFILE_APP_ID"
              exit 1
              ;;
          esac

          if [ "$APS_ENV" != "production" ]; then
            echo "::error::Expected aps-environment=production for App Store distribution."
            exit 1
          fi

          # A wildcard is accepted by this diagnostic check.
          # The actual archive export remains responsible for validating signing.
          if [ "$ASSOCIATED_DOMAINS" = "*" ]; then
            echo "::warning::The profile reports a wildcard Associated Domains entitlement. Continuing to the actual export step."
          elif ! printf '%s\n' "$ASSOCIATED_DOMAINS" \
            | grep -Fq "applinks:kharis-app-47c49.web.app"; then
            echo "::error::The profile output does not show the required Associated Domains domain."
            exit 1
          fi

          echo "Provisioning profile diagnostic checks passed."

      # 9. Calculate unique build number
      - name: Calculate build number
        id: build
        run: |
          set -euo pipefail

          BUILD_NUMBER=$(( ${{ github.run_number }} + 4 ))

          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using build number: $BUILD_NUMBER"

      # 10. Install CocoaPods
      - name: Install CocoaPods
        working-directory: app/ios
        run: |
          set -euo pipefail
          pod install

      # 11. Generate export options in the exact location used by the build
      - name: Prepare iOS export options
        working-directory: app
        run: |
          set -euo pipefail

          BUNDLE_ID=$(
            xcodebuild \
              -project ios/Runner.xcodeproj \
              -scheme Runner \
              -configuration Release \
              -showBuildSettings 2>/dev/null \
            | awk -F ' = ' \
              '/^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = / {print $2; exit}'
          )

          if [ -z "$BUNDLE_ID" ]; then
            echo "::error::Could not determine the iOS bundle identifier."
            exit 1
          fi

          echo "Bundle identifier: $BUNDLE_ID"

          if [ "$BUNDLE_ID" != "com.kharis.church" ]; then
            echo "::error::Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi

          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            ../profile.plist)

          case "$PROFILE_APP_ID" in
            *."$BUNDLE_ID") ;;
            *)
              echo "::error::Provisioning profile App ID ($PROFILE_APP_ID) does not match bundle ID ($BUNDLE_ID)."
              exit 1
              ;;
          esac

          cat > export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>Z9TTRH45X3</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          echo "===== EXPORT OPTIONS ====="
          plutil -lint export_options.plist
          plutil -p export_options.plist

      # 12. Build the signed App Store IPA
      - name: Build IPA
        working-directory: app
        run: |
          set -euo pipefail

          flutter build ipa \
            --release \
            --build-number=${{ steps.build.outputs.build_number }} \
            --dart-define-from-file=env.json \
            --export-options-plist=export_options.plist

      # 13. Find the generated IPA
      - name: Find IPA
        id: ipa
        run: |
          set -euo pipefail

          IPA_PATH=$(find app/build/ios/ipa \
            -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA_PATH" ]; then
            echo "::error::IPA not found in app/build/ios/ipa."
            exit 1
          fi

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "Found IPA: $IPA_PATH"

      # 14. Save the IPA artifact before attempting upload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa-${{ steps.build.outputs.build_number }}
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # 15. Upload the IPA to TestFlight
      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail

          xcrun altool \
            --upload-app \
            --type ios \
            --file "${{ steps.ipa.outputs.ipa_path }}" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD"

      # 16. Clean up temporary files and keychain
      - name: Cleanup
        if: always()
        run: |
          rm -f app/env.json
          rm -f certificate.p12
          rm -f profile.mobileprovision
          rm -f profile.plist
          rm -f app/export_options.plist

          security delete-keychain build.keychain 2>/dev/null || true
