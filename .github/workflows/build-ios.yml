name: Build and Upload iOS to TestFlight

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 5'

jobs:
  build-ios:
    name: Build iOS Release IPA
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Restore env.json
        working-directory: app
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" > env.json

      - name: Install Apple Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain -p build build.keychain

          security list-keychains -d user -s build.keychain login.keychain-db

          security default-keychain -s build.keychain

          security unlock-keychain -p build build.keychain

          security set-keychain-settings -lut 21600 build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k build \
            build.keychain

          echo "===== SIGNING IDENTITIES ====="
          security find-identity -v -p codesigning

      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Calculate build number
        id: build
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 4 ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Install CocoaPods
        working-directory: app/ios
        run: |
          pod install

      - name: Build IPA
        working-directory: app
        run: |
          flutter build ipa \
            --release \
            --build-number=${{ steps.build.outputs.build_number }} \
            --dart-define-from-file=env.json

      - name: Configure App Store Connect API Key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys

          cat > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 <<EOF
          $APPSTORE_PRIVATE_KEY
          EOF

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          IPA_PATH=$(find app/build/ios/ipa -name "*.ipa" | head -n 1)

          echo "Uploading: $IPA_PATH"

          xcrun altool \
            --upload-app \
     