name: Build iOS IPA

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 5'

jobs:
  build-ios:
    name: Build iOS Release IPA
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required secrets are present
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          missing=""

          [ -n "$IOS_CERTIFICATE_BASE64" ] || missing="$missing IOS_CERTIFICATE_BASE64"
          [ -n "$IOS_CERTIFICATE_PASSWORD" ] || missing="$missing IOS_CERTIFICATE_PASSWORD"
          [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "$ENV_JSON" ] || missing="$missing ENV_JSON"

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Restore env.json
        working-directory: app
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" > env.json

      - name: Install Apple Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain -p build build.keychain

          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k build \
            build.keychain

      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Calculate build number
        id: build
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 4 ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Using build number: $BUILD_NUMBER"

      - name: Install CocoaPods
        working-directory: app/ios
        run: pod install
      - name: Verify provisioning profile
        run: |
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles
      - name: Build IPA
        working-directory: app
        run: |
          flutter build ipa \
            --release \
            --build-number=${{ steps.build.outputs.build_number }} \
            --dart-define-from-file=env.json

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa-${{ steps.build.outputs.build_number }}
          path: app/build/ios/ipa/*.ipa
          retention-days: 30

      - name: Scrub credentials
        if: always()
        run: |
          rm -f app/env.json
          rm -f certificate.p12
          rm -f profile.mobileprovision