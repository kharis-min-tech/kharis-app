name: Build and Upload iOS to TestFlight

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 5'

jobs:
  build-ios:
    name: Build iOS Release IPA
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=""

          [ -n "$IOS_CERTIFICATE_BASE64" ] || missing="$missing IOS_CERTIFICATE_BASE64"
          [ -n "$IOS_CERTIFICATE_PASSWORD" ] || missing="$missing IOS_CERTIFICATE_PASSWORD"
          [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "$ENV_JSON" ] || missing="$missing ENV_JSON"
          [ -n "$APPLE_ID" ] || missing="$missing APPLE_ID"
          [ -n "$APPLE_APP_PASSWORD" ] || missing="$missing APPLE_APP_PASSWORD"

          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Restore env.json
        working-directory: app
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" > env.json

      - name: Install Apple Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain -p build build.keychain

          security list-keychains -d user -s build.keychain login.keychain-db

          security default-keychain -s build.keychain

          security unlock-keychain -p build build.keychain

          security set-keychain-settings -lut 21600 build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k build \
            build.keychain

          echo "===== SIGNING IDENTITIES ====="
          security find-identity -v -p codesigning

      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Verify Provisioning Profile
        run: |
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Calculate build number
        id: build
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 4 ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Using build number: $BUILD_NUMBER"

      - name: Install CocoaPods
        working-directory: app/ios
        run: |
          pod install

      - name: Build IPA
        working-directory: app
        run: |
          flutter build ipa \
            --release \
            --build-number=${{ steps.build.outputs.build_number }} \
            --dart-define-from-file=env.json

      - name: Find IPA
        id: ipa
        run: |
          IPA_PATH=$(find app/build/ios/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found"
            exit 1
          fi

          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "Found IPA: $IPA_PATH"

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "${{ steps.ipa.outputs.ipa_path }}" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa-${{ steps.build.outputs.build_number }}
          path: app/build/ios/ipa/*.ipa
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          rm -f app/env.json
          rm -f certificate.p12
          rm -f profile.mobileprovision