name: Deploy Backend

# Deploys Cloud Functions + Firestore rules/indexes to kharis-app-47c49.
#
# Runs only from main (a stale branch deploy would ship its rules and, with
# --force, delete every function missing from it) and only through the
# `production` GitHub environment: configure that environment's required
# reviewers so each deploy needs approval, and store the secrets below as
# environment secrets.
#
# Auth, in order of preference — set ONE of these secrets:
#
#   FIREBASE_SERVICE_ACCOUNT  (preferred) JSON key for a service account with
#                             Firebase Admin + Cloud Functions Developer +
#                             Secret Manager Admin on kharis-app-47c49 (the
#                             deploy grants the runtime service account access
#                             to YOUTUBE_API_KEY). Used via
#                             GOOGLE_APPLICATION_CREDENTIALS.
#   FIREBASE_TOKEN            (legacy) output of `firebase login:ci`. Google has
#                             deprecated these CI tokens; prefer the service
#                             account above.
#
# Neither is set today, so this workflow has never completed a run.
#
# YOUTUBE_API_KEY (sync-youtube.ts) is a Secret Manager secret
# (`defineSecret`), set once with `firebase functions:secrets:set
# YOUTUBE_API_KEY` (backend/SETUP.md). The deploy only references it, so no
# key passes through this workflow; it fails if the secret was never set.
#
# firebase-tools is the version pinned in backend/functions/package.json
# (installed by `npm ci` from the lockfile) and run with `npx --no-install`,
# so a deploy never downloads an unpinned CLI.

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Firebase Functions & Firestore
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials are present
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$SA" ] && [ -z "$TOKEN" ]; then
            echo "::error::Set FIREBASE_SERVICE_ACCOUNT (preferred) or FIREBASE_TOKEN — see the header of .github/workflows/deploy-backend.yml"
            exit 1
          fi
          if [ -z "$SA" ]; then
            echo "::warning::Using the deprecated FIREBASE_TOKEN. Migrate to FIREBASE_SERVICE_ACCOUNT."
            echo "HAS_SA=false" >> "$GITHUB_ENV"
          else
            echo "HAS_SA=true" >> "$GITHUB_ENV"
          fi

      # Must match "engines.node" in backend/functions/package.json (the
      # runtime the functions deploy to).
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install dependencies
        working-directory: backend/functions
        run: npm ci

      - name: Build functions
        working-directory: backend/functions
        run: npm run build --if-present

      - name: Write service-account key
        if: env.HAS_SA == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      # Run from backend/functions so `npx --no-install` resolves the pinned
      # CLI in its node_modules; firebase-tools finds ../firebase.json itself.
      - name: Deploy to Firebase
        working-directory: backend/functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # With GOOGLE_APPLICATION_CREDENTIALS set, firebase-tools picks the
          # service account up automatically and --token is unnecessary.
          # --force lets a non-interactive deploy delete functions that are no
          # longer exported (e.g. the retired feedProxy and Studio's
          # onNotificationWritten, sendDueNotifications and searchYouTube)
          # instead of failing.
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            npx --no-install firebase deploy --only functions,firestore \
              --project kharis-app-47c49 --non-interactive --force
          else
            npx --no-install firebase deploy --only functions,firestore \
              --project kharis-app-47c49 --token "$FIREBASE_TOKEN" --non-interactive --force
          fi

      - name: Scrub credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"
