name: Build Mobile Apps {UAT}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  build-number:
    name: Generate Build Number
    runs-on: ubuntu-latest

    outputs:
      build_number: ${{ steps.build.outputs.build_number }}

    steps:
      - name: Generate build number
        id: build
        run: |
          BUILD_NUMBER=$(date +%s)

          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Using build number: $BUILD_NUMBER"

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-number

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          missing=""

          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEY_PROPERTIES" ] || missing="$missing KEY_PROPERTIES"
          [ -n "$ENV_JSON" ] || missing="$missing ENV_JSON"
          [ -n "$FIREBASE_APP_ID" ] || missing="$missing FIREBASE_APP_ID"
          [ -n "$FIREBASE_TOKEN" ] || missing="$missing FIREBASE_TOKEN"

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Restore env.json
        working-directory: app
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" > env.json

      - name: Decode keystore
        working-directory: app/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > kharis-release.jks

      - name: Create key.properties
        working-directory: app/android
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          printf '%s' "$KEY_PROPERTIES" > key.properties

      - name: Rename Android app to Kharis DEV
        run: |
          sed -i 's|android:label="Kharis Church"|android:label="Kharis DEV"|g' \
            app/android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        working-directory: app
        run: |
          flutter build apk \
            --release \
            --build-number=${{ needs.build-number.outputs.build_number }} \
            --dart-define-from-file=env.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.build-number.outputs.build_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload APK to Firebase
        run: |
          firebase appdistribution:distribute \
            app/build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --groups "android-testers"

      - name: Cleanup
        if: always()
        run: |
          rm -f app/env.json
          rm -f app/android/key.properties
          rm -f app/android/app/kharis-release.jks

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: build-number

    env:
      BUNDLE_ID: com.kharis.church
      TEAM_ID: Z9TTRH45X3
      EXPECTED_PROFILE_UUID: 979a3d26-6f9e-457d-8f5e-651006b23894
      REQUIRED_ASSOCIATED_DOMAIN: applinks:kharis-app-47c49.web.app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=""

          [[ -n "$IOS_CERTIFICATE_BASE64" ]] || missing="$missing IOS_CERTIFICATE_BASE64"
          [[ -n "$IOS_CERTIFICATE_PASSWORD" ]] || missing="$missing IOS_CERTIFICATE_PASSWORD"
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [[ -n "$ENV_JSON" ]] || missing="$missing ENV_JSON"
          [[ -n "$APPLE_ID" ]] || missing="$missing APPLE_ID"
          [[ -n "$APPLE_APP_PASSWORD" ]] || missing="$missing APPLE_APP_PASSWORD"

          if [[ -n "$missing" ]]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Restore env.json
        working-directory: app
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$ENV_JSON" > env.json

      - name: Rename iOS app to Kharis DEV
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Kharis DEV" \
            app/ios/Runner/Info.plist

      - name: Install Apple Certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/kharis-build.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          PROFILE_FILE="$RUNNER_TEMP/profile.mobileprovision"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" \
            | base64 -D > "$PROFILE_FILE"

          cp "$PROFILE_FILE" "$PROFILE_DIR/"

      - name: Install CocoaPods
        working-directory: app/ios
        run: pod install

      - name: Create Export Options
        working-directory: app
        run: |
          cat > export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        working-directory: app
        env:
          BUILD_NUMBER: ${{ needs.build-number.outputs.build_number }}
        run: |
          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=env.json \
            --export-options-plist=export_options.plist

      - name: Find IPA
        id: ipa
        run: |
          IPA_PATH=$(find app/build/ios/ipa -name "*.ipa" | head -n 1)

          if [ -z "$IPA_PATH" ]; then
            echo "::error::IPA not found"
            exit 1
          fi

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ needs.build-number.outputs.build_number }}
          path: ${{ steps.ipa.outputs.ipa_path }}

      - name: Upload to TestFlight
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Cleanup
        if: always()
        run: |
          rm -f app/env.json
          rm -f app/export_options.plist