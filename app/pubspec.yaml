name: kharis_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  just_audio: ^0.9.42
  audio_service: ^0.18.17
  cached_network_image: ^3.4.1
  hive_flutter: ^1.1.0
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  add_2_calendar_new: ^1.0.4
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  youtube_player_iframe: ^6.0.2
  web: ^1.1.1
  firebase_analytics: ^11.6.0
  firebase_auth: ^5.5.1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.8
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.1.25
  # youtube_player_iframe does not hold a wakelock; without this the screen can
  # sleep mid-video. Enabled only while the video engine reports playing.
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^3.1.0
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/figma/
    - assets/icon/
    - assets/data/
    - assets/design/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#5D3FD3"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# Native splash — what shows BEFORE the first Flutter frame. It must match
# SplashScreen, or launch reads as a flat card that then jumps to the worship
# photo. No purple: the photo itself is the background, with the dove centred
# on top, so the member opens the app straight into the congregation shot.
#
# `background_image` must be a PNG. Pointed at a .jpg, flutter_native_splash
# silently emits a 1x1 placeholder and the splash falls back to a flat `color`
# — which is exactly how the purple card got there. splash-bg.png is generated
# from splash-pink.jpg pre-cropped to BoxFit.cover framing so the native splash
# and SplashScreen show the same crop.
#
# `color` and `background_image` are MUTUALLY EXCLUSIVE: flutter_native_splash
# takes the `color` branch first and writes a 1x1 PNG of it, silently ignoring
# the image (see ios.dart _createBackground). A top-level `color` is therefore
# omitted deliberately — adding one back reinstates the flat purple card.
#
# Android 12+ is the exception: it draws a system centred icon on a solid plate
# and cannot full-bleed, so it keeps its own colour — a dark tone sampled from
# the photo, chosen so the white dove stays legible and nothing reads as brand
# purple.
#
# AFTER running `dart run flutter_native_splash:create`, re-add the 2x/3x
# launch background slots. The package writes the image into the imageset's 1x
# slot only and leaves 2x/3x empty, so on an @3x device the photo is a 1x asset
# claiming to be 1242pt wide. scaleToFill hides it visually, but the correct
# assets are 414x896 / 828x1792 / 1242x2688 in
# ios/Runner/Assets.xcassets/LaunchBackground.imageset.
flutter_native_splash:
  background_image: assets/design/splash-bg.png
  image: assets/icon/icon_foreground.png
  android_12:
    color: "#34161C"
    image: assets/icon/icon_foreground.png
